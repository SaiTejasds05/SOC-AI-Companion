<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator</title>
</head>
<body>
  <h1>Generate PNG Icons from SVG</h1>
  <p>Open this file in a browser and click the buttons to download PNG icons.</p>
  
  <canvas id="canvas" style="display: none;"></canvas>
  
  <div id="buttons"></div>
  
  <script>
    const sizes = [16, 32, 48, 128];
    const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#0078d4;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#106ebe;stop-opacity:1" />
        </linearGradient>
      </defs>
      <rect width="128" height="128" rx="24" fill="url(#grad)"/>
      <path d="M64 20L20 45l44 25 44-25-44-25zM20 83l44 25 44-25M20 58l44 25 44-25" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="64" cy="64" r="8" fill="white"/>
    </svg>`;
    
    function generateIcon(size) {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = size;
      canvas.height = size;
      
      const img = new Image();
      const blob = new Blob([svgString], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      
      img.onload = function() {
        ctx.drawImage(img, 0, 0, size, size);
        canvas.toBlob(function(blob) {
          const link = document.createElement('a');
          link.download = `icon${size}.png`;
          link.href = URL.createObjectURL(blob);
          link.click();
          URL.revokeObjectURL(url);
        });
      };
      
      img.src = url;
    }
    
    sizes.forEach(size => {
      const btn = document.createElement('button');
      btn.textContent = `Download icon${size}.png`;
      btn.onclick = () => generateIcon(size);
      btn.style.margin = '10px';
      btn.style.padding = '10px 20px';
      document.getElementById('buttons').appendChild(btn);
    });
  </script>
</body>
</html>
