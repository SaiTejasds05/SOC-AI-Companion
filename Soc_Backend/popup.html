<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copilot Launcher</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      width: 280px;
      padding: 20px;
      background: #ffffff;
    }

    .popup-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #edebe9;
    }

    .popup-icon {
      width: 32px;
      height: 32px;
      color: #0078d4;
    }

    .popup-title {
      font-size: 18px;
      font-weight: 600;
      color: #323130;
    }

    .popup-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .popup-button {
      width: 100%;
      padding: 12px 16px;
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .popup-button:hover {
      background: #106ebe;
    }

    .popup-button:active {
      transform: scale(0.98);
    }

    .popup-info {
      font-size: 12px;
      color: #605e5c;
      line-height: 1.5;
      margin-top: 8px;
    }

    .popup-status {
      padding: 8px 12px;
      background: #f5f5f5;
      border-radius: 6px;
      font-size: 12px;
      color: #323130;
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <svg class="popup-icon" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
    </svg>
    <div class="popup-title">Copilot</div>
  </div>
  <div class="popup-content">
    <button class="popup-button" id="openSidebar">Open Sidebar</button>
    <div class="popup-status">
      Click to open the Copilot sidebar panel
    </div>
    <div class="popup-info">
      The sidebar will open on the right side of your browser and stay open as you navigate between pages.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
